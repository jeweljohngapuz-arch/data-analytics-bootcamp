<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Analyst Language Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface2: #f0f0ec;
  --border: #e2e2dc;
  --text: #1a1a18;
  --muted: #888880;
  --muted2: #b0b0a8;
  --green: #1a9e5c;
  --green-bg: #edfaf3;
  --green-border: #a3dfc0;
  --red: #d93f3f;
  --red-bg: #fdf0f0;
  --red-border: #f0b0b0;
  --yellow: #d97c00;
  --yellow-bg: #fef8ec;
  --yellow-border: #f5d98a;
  --blue: #2563eb;
  --blue-bg: #eff4ff;
  --blue-border: #b0c8f5;
  --accent: #1a1a18;
  --radius: 12px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ── HOME SCREEN ── */
#home {
  padding: 32px 20px 40px;
  align-items: center;
  justify-content: center;
  gap: 0;
}

.home-inner {
  width: 100%;
  max-width: 480px;
}

.app-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.app-title span { color: var(--green); }

.app-sub {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 32px;
}

/* stats bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  text-align: center;
}

.stat-val {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  display: block;
}

.stat-val.green { color: var(--green); }
.stat-val.red { color: var(--red); }

.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
  display: block;
}

/* stage cards */
.stage-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.stage-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 14px;
  -webkit-user-select: none;
  user-select: none;
}

.stage-card:active { transform: scale(0.98); }
.stage-card:hover { border-color: var(--accent); }

.stage-card.locked { opacity: 0.4; cursor: not-allowed; }

.stage-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.stage-info { flex: 1; min-width: 0; }
.stage-name { font-weight: 700; font-size: 15px; }
.stage-desc { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.stage-meta { text-align: right; flex-shrink: 0; }
.stage-pct { font-weight: 700; font-size: 14px; }
.stage-qcount { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

/* mini progress bar */
.mini-prog { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.mini-prog-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

/* drill weak btn */
.drill-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
  margin-bottom: 10px;
}

.drill-btn:active { opacity: 0.8; }
.drill-btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  font-weight: 600;
}

/* ── GAME SCREEN ── */
#game {
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
  padding: 0;
}

/* game header */
.game-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.btn-back {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  color: var(--text);
  line-height: 1;
}

.game-title-sm { font-weight: 700; font-size: 14px; flex: 1; }

/* hearts */
.hearts { display: flex; gap: 4px; }
.heart { font-size: 18px; transition: all 0.2s; }
.heart.lost { opacity: 0.2; filter: grayscale(1); }

/* streak badge */
.streak-badge {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--yellow);
  background: var(--yellow-bg);
  border: 1px solid var(--yellow-border);
  border-radius: 99px;
  padding: 3px 10px;
}

/* progress */
.game-prog-wrap { padding: 10px 16px 0; }
.game-prog-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.game-prog-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.4s ease; }
.game-prog-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 5px; text-align: right; }

/* question area */
.game-body { padding: 20px 16px 100px; flex: 1; }

/* context strip */
.ctx-strip {
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 18px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: #2563eb;
  line-height: 1.7;
}

.ctx-lbl { font-size: 9px; letter-spacing: 2px; opacity: 0.7; margin-bottom: 3px; }

/* type tag */
.type-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.type-dot { width: 6px; height: 6px; border-radius: 50%; }

/* question text */
.q-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 20px;
}

.q-hint {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin-bottom: 16px;
  border: 1px dashed var(--border);
}

/* ── FLASHCARD ── */
.fc-wrap { perspective: 800px; margin-bottom: 20px; }

.fc {
  width: 100%;
  min-height: 160px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s ease;
  cursor: pointer;
}

.fc.flipped { transform: rotateY(180deg); }

.fc-side {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 24px;
  text-align: center;
  background: var(--surface);
}

.fc-back-side { transform: rotateY(180deg); background: var(--surface2); }

.fc-lbl { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; }
.fc-casual-word { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.fc-tap-hint { font-size: 12px; color: var(--muted2); margin-top: 10px; }
.fc-term-word { font-size: 22px; font-weight: 800; color: var(--green); margin-bottom: 8px; }
.fc-example { font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.6; max-width: 280px; }

.fc-rate-row { display: flex; gap: 10px; margin-top: 14px; }

.fc-rate-btn {
  flex: 1; padding: 12px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
}

.fc-rate-btn:active { transform: scale(0.96); }
.fc-rate-btn.again { border-color: var(--red-border); color: var(--red); background: var(--red-bg); }
.fc-rate-btn.good { border-color: var(--yellow-border); color: var(--yellow); background: var(--yellow-bg); }
.fc-rate-btn.easy { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }

/* ── MC OPTIONS ── */
.opts { display: flex; flex-direction: column; gap: 9px; }

.opt {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: all 0.12s;
  display: flex; align-items: center; gap: 12px;
  -webkit-user-select: none; user-select: none;
}

.opt:active:not(:disabled) { transform: scale(0.98); }

.opt-key {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
}

.opt.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.opt.correct .opt-key { background: var(--green); color: white; }
.opt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.opt.wrong .opt-key { background: var(--red); color: white; }
.opt:disabled { cursor: default; }

/* ── TEXTAREA ── */
.hint-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }

.chip {
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.12s;
  font-family: 'DM Mono', monospace;
  -webkit-user-select: none; user-select: none;
}

.chip:active { transform: scale(0.95); }
.chip.used { opacity: 0.3; pointer-events: none; }

textarea {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  padding: 14px;
  resize: none;
  min-height: 90px;
  outline: none;
  transition: border-color 0.15s;
  line-height: 1.55;
  -webkit-appearance: none;
}

textarea:focus { border-color: var(--accent); }

/* ── FEEDBACK ── */
.feedback {
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.6;
  display: none;
}

.feedback.show { display: block; }
.fb-correct { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
.fb-wrong { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
.fb-partial { background: var(--yellow-bg); border: 1px solid var(--yellow-border); color: var(--yellow); }

.model-box {
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.7;
  display: none;
  border: 1px solid var(--border);
}

.model-box.show { display: block; }
.model-lbl { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; }
.model-box em { color: var(--green); font-style: normal; font-weight: 700; }

/* ── BOTTOM ACTION BAR ── */
.action-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: center;
  max-width: 560px;
  margin: 0 auto;
}

.btn-primary {
  flex: 1; padding: 14px;
  background: var(--accent);
  color: white; border: none;
  border-radius: var(--radius-sm);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity 0.12s;
}

.btn-primary:active { opacity: 0.8; }
.btn-primary.green-btn { background: var(--green); }
.btn-primary.disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

.btn-secondary {
  padding: 14px 18px;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  cursor: pointer; transition: all 0.12s;
}

.btn-secondary:active { opacity: 0.7; }

/* ── TOAST ── */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
  background: var(--accent); color: white;
  padding: 10px 20px; border-radius: 99px;
  font-size: 13px; font-weight: 700;
  opacity: 0; transition: all 0.25s;
  z-index: 999; white-space: nowrap;
  pointer-events: none;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── NO HEARTS SCREEN ── */
#no-hearts {
  align-items: center; justify-content: center;
  padding: 40px 24px; text-align: center;
}

.no-hearts-emoji { font-size: 64px; margin-bottom: 16px; }
.no-hearts-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.no-hearts-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }

/* ── SUMMARY SCREEN ── */
#summary {
  padding: 32px 20px 40px;
  align-items: center;
}

.summary-inner { width: 100%; max-width: 480px; }
.summary-stage { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 8px; }
.summary-score { font-size: 52px; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 4px; }
.summary-score span { font-size: 24px; color: var(--muted); }
.summary-label { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 24px; }
.summary-msg { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

.weak-list { margin-bottom: 24px; }
.weak-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }

.weak-item {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 10px 14px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius-sm);
  margin-bottom: 7px;
  gap: 12px;
}

.weak-casual { font-size: 13px; color: var(--muted); }
.weak-term { font-size: 13px; font-weight: 700; color: var(--red); text-align: right; }

.summary-btns { display: flex; flex-direction: column; gap: 10px; }

.sum-btn {
  width: 100%; padding: 14px;
  border-radius: var(--radius-sm);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer; border: none; transition: opacity 0.12s;
}

.sum-btn:active { opacity: 0.8; }
.sum-btn.primary { background: var(--green); color: white; }
.sum-btn.secondary { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); }

/* animation */
@keyframes slideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.game-body > * { animation: slideUp 0.2s ease forwards; }

@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shake { animation: shake 0.35s ease; }

@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }
.pop { animation: pop 0.25s ease; }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-inner" style="padding:32px 20px 40px">
    <div class="app-title">Analyst <span>Lab</span></div>
    <div class="app-sub">DATA ANALYTICS VOCABULARY TRAINER</div>

    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-val green" id="home-mastered">0</span>
        <span class="stat-lbl">Mastered</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="home-streak">0</span>
        <span class="stat-lbl">🔥 Streak</span>
      </div>
      <div class="stat-box">
        <span class="stat-val red" id="home-weak">0</span>
        <span class="stat-lbl">To Review</span>
      </div>
    </div>

    <div class="stage-list" id="stage-list"></div>

    <button class="drill-btn" id="drill-weak-btn" onclick="startDrill()" style="display:none">
      🎯 Drill Weak Words
    </button>
    <button class="drill-btn secondary" onclick="resetAll()">↺ Reset All Progress</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="game-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="game-title-sm" id="game-title">INSPECT</div>
    <div class="hearts" id="hearts-display"></div>
    <div class="streak-badge" id="streak-display">🔥 0</div>
  </div>
  <div class="game-prog-wrap">
    <div class="game-prog-track"><div class="game-prog-fill" id="prog-fill"></div></div>
    <div class="game-prog-label" id="prog-label">0 / 0</div>
  </div>
  <div class="game-body" id="game-body"></div>
  <div class="action-bar" id="action-bar">
    <button class="btn-secondary" id="btn-skip" onclick="skipQ()">Skip</button>
    <button class="btn-primary" id="btn-main" onclick="handleMain()">Check</button>
  </div>
</div>

<!-- NO HEARTS -->
<div class="screen" id="no-hearts">
  <div class="no-hearts-emoji">💔</div>
  <div class="no-hearts-title">Out of hearts</div>
  <div class="no-hearts-sub">You used all 5 hearts in this session.<br>Hearts refill when you start a new stage.</div>
  <button class="drill-btn" onclick="goHome()">← Back to stages</button>
  <br>
  <button class="drill-btn secondary" onclick="refillAndContinue()">Refill hearts & continue</button>
</div>

<!-- SUMMARY -->
<div class="screen" id="summary">
  <div class="summary-inner">
    <div class="summary-stage" id="sum-stage"></div>
    <div class="summary-score" id="sum-score">0<span> / 0</span></div>
    <div class="summary-label" id="sum-label">CORRECT</div>
    <div class="summary-msg" id="sum-msg"></div>

    <div class="weak-list" id="weak-list"></div>

    <div class="summary-btns">
      <button class="sum-btn primary" id="sum-next" onclick="summaryNext()">Continue →</button>
      <button class="sum-btn secondary" onclick="summaryReplay()">↺ Replay stage</button>
      <button class="sum-btn secondary" onclick="goHome()">Home</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════

const STAGES = [
{
  id:'inspect', name:'INSPECT', icon:'🔍', color:'#2563eb', bg:'#eff4ff',
  desc:'Name what you see. Spot quality issues.',
  questions:[
    {type:'fc', casual:'table of numbers', term:'dataset', ex:"Let's inspect the dataset first."},
    {type:'fc', casual:'important number', term:'metric', ex:'Revenue is the main metric.'},
    {type:'fc', casual:'business target number', term:'KPI', ex:"Revenue is the company's KPI."},
    {type:'fc', casual:'missing numbers', term:'missing values', ex:'Check for missing values.'},
    {type:'fc', casual:'duplicate rows', term:'duplicates', ex:'Remove duplicate records.'},
    {type:'fc', casual:'strange value', term:'outlier', ex:'This order is an outlier.'},
    {type:'fc', casual:'inconsistent categories', term:'data inconsistency', ex:'Standardize region names.'},
    {type:'fc', casual:'clean data', term:'data cleaning', ex:'Perform data cleaning first.'},
    {type:'fc', casual:'prepare data', term:'data preprocessing', ex:'Preprocess the dataset.'},
    {type:'fc', casual:'incorrect data', term:'data errors', ex:'Fix data errors in price column.'},
    {type:'mc', tag:'CORE DATA', q:'You open a sales file. The table of rows and columns is called a ___.',
     blank:'table of rows and columns', opts:['spreadsheet','database','dataset','table'], ans:2,
     why:'"Dataset" = structured table. Always say dataset, not spreadsheet.'},
    {type:'mc', tag:'CORE DATA', q:'Revenue is the ___ you use to measure sales performance.',
     blank:'___', opts:['number','metric','figure','value'], ans:1,
     why:'"Metric" = key measurement. Revenue, profit, conversion rate are all metrics.'},
    {type:'mc', tag:'DATA QUALITY', q:'Some rows have no value in the units column. You flag these as ___.',
     blank:'___', opts:['empty cells','blank rows','missing values','null fields'], ans:2,
     why:'"Missing values" is the standard term. Check before aggregating.'},

// STATE + STORAGE

const STORAGE_KEY = 'analyst_lab_v4';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function defaultState() {
  return {
    stageProgress: STAGES.map(() => ({ mastered:0, seen:0, weakIds:[] })),
    masteryCounts: {},   // termId -> correct count
    weakTerms: [],       // {casual, term} of missed items
    totalStreak: 0,
    totalCorrect: 0,
    totalAttempted: 0,
  };
}

let state = loadState() || defaultState();

// Session vars (not persisted)
let session = {
  stageIdx: 0,
  queue: [],          // [{qIdx, attempts}]
  queuePos: 0,
  hearts: 5,
  streak: 0,
  correct: 0,
  attempted: 0,
  wrongThisSession: [], // {casual, term}
  isDrill: false,
  answered: false,
  fcFlipped: false,
};

// ══════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════

function goHome() {
  showScreen('home');
  renderHome();
}

function renderHome() {
  // stats
  const totalMastered = state.stageProgress.reduce((a,s) => a + s.mastered, 0);
  const totalWeak = state.weakTerms.length;
  document.getElementById('home-mastered').textContent = totalMastered;
  document.getElementById('home-streak').textContent = state.totalStreak;
  document.getElementById('home-weak').textContent = totalWeak;

  // stage cards
  const list = document.getElementById('stage-list');
  list.innerHTML = STAGES.map((s, i) => {
    const prog = state.stageProgress[i];
    const total = s.questions.length;
    const pct = total > 0 ? Math.round((prog.mastered / total) * 100) : 0;
    return `
      <div class="stage-card" onclick="startStage(${i})">
        <div class="stage-icon" style="background:${s.bg}">${s.icon}</div>
        <div class="stage-info">
          <div class="stage-name">${s.name}</div>
          <div class="stage-desc">${s.desc}</div>
          <div class="mini-prog"><div class="mini-prog-fill" style="width:${pct}%;background:${s.color}"></div></div>
        </div>
        <div class="stage-meta">
          <div class="stage-pct" style="color:${s.color}">${pct}%</div>
          <div class="stage-qcount">${total}Q</div>
        </div>
      </div>`;
  }).join('');

  // drill button
  document.getElementById('drill-weak-btn').style.display = totalWeak > 0 ? 'block' : 'none';
}

// ══════════════════════════════════════════════
// START STAGE
// ══════════════════════════════════════════════

function startStage(idx) {
  session.stageIdx = idx;
  session.isDrill = false;
  session.hearts = 5;
  session.streak = 0;
  session.correct = 0;
  session.attempted = 0;
  session.wrongThisSession = [];
  session.answered = false;
  session.fcFlipped = false;

  // Build queue — all questions in order; wrong ones will re-queue
  const qs = STAGES[idx].questions;
  session.queue = qs.map((_, i) => ({ qIdx: i, attempts: 0 }));
  session.queuePos = 0;

  showScreen('game');
  updateGameHeader();
  renderQ();
}

function startDrill() {
  session.stageIdx = -1;
  session.isDrill = true;
  session.hearts = 5;
  session.streak = 0;
  session.correct = 0;
  session.attempted = 0;
  session.wrongThisSession = [];
  session.answered = false;
  session.fcFlipped = false;

  // Build drill queue from weakTerms — as write/translate questions
  session.queue = state.weakTerms.map((w, i) => ({ qIdx: i, attempts: 0, drillItem: w }));
  session.queuePos = 0;

  showScreen('game');
  document.getElementById('game-title').textContent = '🎯 DRILL WEAK WORDS';
  updateHeartsUI();
  updateStreakUI();
  renderDrillQ();
}

function refillAndContinue() {
  session.hearts = 3;
  showScreen('game');
  updateHeartsUI();
  renderQ();
}

// ══════════════════════════════════════════════
// RENDER QUESTION
// ══════════════════════════════════════════════

function renderQ() {
  session.answered = false;
  session.fcFlipped = false;

  const total = session.queue.length;
  if (session.queuePos >= total) { showSummary(); return; }

  const item = session.queue[session.queuePos];
  const stage = STAGES[session.stageIdx];
  const q = stage.questions[item.qIdx];

  updateProgress();
  updateActionBar('check');

  const body = document.getElementById('game-body');
  body.innerHTML = '';

  const ctx = stage.ctx ? `<div class="ctx-strip"><div class="ctx-lbl">YOUR DATA</div>${stage.ctx}</div>` : '';

  if (q.type === 'fc') renderFC(body, q, ctx);
  else if (q.type === 'mc') renderMC(body, q, ctx);
  else if (q.type === 'write') renderWrite(body, q, ctx);
  else if (q.type === 'translate') renderTranslate(body, q);
}

function renderDrillQ() {
  session.answered = false;
  if (session.queuePos >= session.queue.length) { showSummary(); return; }
  const item = session.queue[session.queuePos];
  const w = item.drillItem;
  updateProgress();
  updateActionBar('check');
  const body = document.getElementById('game-body');
  body.innerHTML = '';
  const typeTag = typeTagHTML('✍️', 'TRANSLATE TO ANALYST', '#dc2626');
  const hints = [w.term];
  const hintHtml = hints.map((h,i) => `<span class="chip" onclick="insertChip(this,'${h}')">${h}</span>`).join('');
  body.innerHTML = `
    ${typeTag}
    <div class="ctx-strip" style="border-color:#fca5a5;background:#fff1f1;color:#dc2626">
      <div class="ctx-lbl">CASUAL</div>"${w.casual}"
    </div>
    <div class="q-text">Rewrite in analyst language:</div>
    <div class="hint-chips">${hintHtml}</div>
    <textarea id="ta" rows="3" placeholder="Type your analyst version..."></textarea>
    <div class="feedback" id="fb"></div>
    <div class="model-box" id="mb"><div class="model-lbl">MODEL ANSWER</div><div id="mt"></div></div>`;
}

// ── FC ──
function renderFC(body, q, ctx) {
  const typeTag = typeTagHTML('🃏', 'FLASHCARD · TAP TO FLIP', '#2563eb');
  body.innerHTML = `
    ${typeTag}
    ${ctx}
    <div class="fc-wrap">
      <div class="fc" id="fc" onclick="flipFC()">
        <div class="fc-side fc-front-side">
          <div class="fc-lbl">CASUAL TERM</div>
          <div class="fc-casual-word">${q.casual}</div>
          <div class="fc-tap-hint">tap to reveal →</div>
        </div>
        <div class="fc-side fc-back-side">
          <div class="fc-lbl">ANALYST TERM</div>
          <div class="fc-term-word">${q.term}</div>
          <div class="fc-example">"${q.ex}"</div>
        </div>
      </div>
    </div>
    <div id="fc-rate" style="display:none">
      <div class="fc-rate-row">
        <button class="fc-rate-btn again" onclick="rateFC('again')">↺ Again</button>
        <button class="fc-rate-btn good" onclick="rateFC('good')">~ Good</button>
        <button class="fc-rate-btn easy" onclick="rateFC('easy')">✓ Easy</button>
      </div>
    </div>`;
  updateActionBar('hidden');
}

function flipFC() {
  if (session.fcFlipped) return;
  session.fcFlipped = true;
  document.getElementById('fc').classList.add('flipped');
  setTimeout(() => {
    const r = document.getElementById('fc-rate');
    if (r) r.style.display = 'block';
  }, 450);
}

function rateFC(rating) {
  session.attempted++;
  const q = STAGES[session.stageIdx].questions[session.queue[session.queuePos].qIdx];
  const termId = q.casual;

  if (rating === 'again') {
    // Re-queue at end
    session.streak = 0;
    session.queue.push({ qIdx: session.queue[session.queuePos].qIdx, attempts: 1 });
    addWeak(q.casual, q.term);
    showToast('↺ Coming back later');
  } else if (rating === 'good') {
    session.correct++;
    session.streak++;
    incrementMastery(termId, 1);
    state.totalCorrect++;
    showToast('👍 Good');
    updateStreak();
  } else {
    session.correct++;
    session.streak++;
    incrementMastery(termId, 2);
    state.totalCorrect++;
    removeWeak(q.casual);
    showToast('⚡ Easy!');
    updateStreak();
  }
  state.totalAttempted++;
  saveState();
  session.queuePos++;
  updateStreakUI();
  setTimeout(renderQ, 400);
}

// ── MC ──
function renderMC(body, q, ctx) {
  const typeTag = typeTagHTML('◉', q.tag || 'MULTIPLE CHOICE', '#1a9e5c');
  const keys = ['A','B','C','D'];
  body.innerHTML = `
    ${typeTag}
    ${ctx}
    <div class="q-text">${q.q.replace(q.blank||'___', `<u>${q.blank||'___'}</u>`)}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i) => `
        <button class="opt" onclick="checkMC(${i})" id="opt-${i}">
          <span class="opt-key">${keys[i]}</span>${o}
        </button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="model-box" id="mb"><div class="model-lbl">WHY</div><div id="mt"></div></div>`;
  updateActionBar('hidden');
}

function checkMC(chosen) {
  if (session.answered) return;
  session.answered = true;
  session.attempted++;
  state.totalAttempted++;
  const q = STAGES[session.stageIdx].questions[session.queue[session.queuePos].qIdx];
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const correct = chosen === q.ans;
  document.getElementById('opt-'+q.ans).classList.add('correct');
  if (!correct) document.getElementById('opt-'+chosen).classList.add('wrong');

  if (correct) {
    session.correct++; session.streak++;
    state.totalCorrect++;
    incrementMastery(q.casual, 1);
    removeWeak(q.casual);
    showFB('fb', true, '✓ ' + q.why);
    showToast(streakMsg());
  } else {
    session.streak = 0;
    addWeak(q.casual, q.term);
    session.wrongThisSession.push({casual:q.casual, term:q.term});
    session.queue.push({ qIdx: session.queue[session.queuePos].qIdx, attempts: 1 });
    showFB('fb', false, '✗ ' + q.why);
    document.getElementById('game-body').classList.add('shake');
    setTimeout(() => document.getElementById('game-body').classList.remove('shake'), 400);
    loseHeart();
  }

  document.getElementById('mt').textContent = q.why;
  document.getElementById('mb').className = 'model-box show';
  updateStreakUI();
  saveState();
  updateActionBar('next');
}

// ── WRITE ──
function renderWrite(body, q, ctx) {
  const typeTag = typeTagHTML('✍️', q.tag || 'WRITE THE INSIGHT', '#7c3aed');
  const hintHtml = (q.hints||[]).map(h => `<span class="chip" onclick="insertChip(this,'${h}')">${h}</span>`).join('');
  const tmpl = q.prompt.includes('Template') ? '' : '';
  body.innerHTML = `
    ${typeTag}
    ${ctx}
    <div class="q-text">${q.prompt.replace(/\n/g,'<br>')}</div>
    ${q.hints ? `<div class="q-hint">💡 Tap a hint to insert it</div><div class="hint-chips">${hintHtml}</div>` : ''}
    <textarea id="ta" rows="3" placeholder="Write your analyst sentence here..."></textarea>
    <div class="feedback" id="fb"></div>
    <div class="model-box" id="mb"><div class="model-lbl">MODEL ANSWER</div><div id="mt"></div></div>`;
}

// ── TRANSLATE ──
function renderTranslate(body, q) {
  const typeTag = typeTagHTML('🔄', 'TRANSLATE TO ANALYST', '#dc2626');
  const hintHtml = (q.hints||[]).map(h => `<span class="chip" onclick="insertChip(this,'${h}')">${h}</span>`).join('');
  body.innerHTML = `
    ${typeTag}
    <div class="ctx-strip" style="border-color:#fca5a5;background:#fff1f1;color:#dc2626">
      <div class="ctx-lbl">CASUAL</div>"${q.casual}"
    </div>
    <div class="q-text">Rewrite in analyst language:</div>
    ${q.hints ? `<div class="q-hint">💡 Tap a hint to insert it</div><div class="hint-chips">${hintHtml}</div>` : ''}
    <textarea id="ta" rows="3" placeholder="Type your analyst version..."></textarea>
    <div class="feedback" id="fb"></div>
    <div class="model-box" id="mb"><div class="model-lbl">MODEL ANSWER</div><div id="mt"></div></div>`;
}

function insertChip(el, text) {
  el.classList.add('used');
  const ta = document.getElementById('ta');
  if (!ta) return;
  const v = ta.value;
  ta.value = v + (v && !v.endsWith(' ') ? ' ' : '') + text + ' ';
  ta.focus();
}

function checkOpen() {
  if (session.answered) return;
  const ta = document.getElementById('ta');
  if (!ta || !ta.value.trim()) return;
  session.answered = true;
  session.attempted++;
  state.totalAttempted++;

  const input = ta.value.toLowerCase().trim();
  const item = session.queue[session.queuePos];
  let q;
  if (session.isDrill) {
    const w = item.drillItem;
    q = { keys: [w.term.toLowerCase()], model: w.term, highlights: [w.term], casual: w.casual, term: w.term };
  } else {
    q = STAGES[session.stageIdx].questions[item.qIdx];
  }

  const keys = q.keys || [];
  const hits = keys.filter(k => input.includes(k.toLowerCase()));
  const ratio = keys.length > 0 ? hits.length / keys.length : 1;
  const passed = ratio >= 0.5;

  if (passed) {
    session.correct++; session.streak++;
    state.totalCorrect++;
    incrementMastery(q.casual || '', 1);
    removeWeak(q.casual || '');
    const fbText = hits.length > 0 ? `✓ Key terms found: ${hits.join(', ')}` : '✓ Good answer.';
    showFB('fb', true, fbText);
    showToast(streakMsg());
  } else {
    session.streak = 0;
    addWeak(q.casual, q.term);
    session.wrongThisSession.push({casual: q.casual||'', term: q.term||''});
    session.queue.push({ qIdx: item.qIdx, attempts: 1, drillItem: item.drillItem });
    const missed = keys.filter(k => !input.includes(k.toLowerCase()));
    showFB('fb', false, `✗ Try including: ${missed.join(', ')}`);
    loseHeart();
  }

  // Highlight model
  let mHtml = q.model || q.term || '';
  (q.highlights || []).forEach(h => { mHtml = mHtml.replace(new RegExp(h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), `<em>${h}</em>`); });
  document.getElementById('mt').innerHTML = mHtml;
  document.getElementById('mb').className = 'model-box show';
  updateStreakUI();
  saveState();
  updateActionBar('next');
}

// ══════════════════════════════════════════════
// HEARTS
// ══════════════════════════════════════════════

function loseHeart() {
  session.hearts = Math.max(0, session.hearts - 1);
  updateHeartsUI();
  if (session.hearts === 0) {
    setTimeout(() => showScreen('no-hearts'), 800);
  }
}

function updateHeartsUI() {
  const el = document.getElementById('hearts-display');
  const max = 5;
  el.innerHTML = Array.from({length: max}, (_, i) =>
    `<span class="heart${i >= session.hearts ? ' lost' : ''}">❤️</span>`
  ).join('');
}

// ══════════════════════════════════════════════
// STREAK
// ══════════════════════════════════════════════

function updateStreak() {
  state.totalStreak = Math.max(state.totalStreak, session.streak);
}

function updateStreakUI() {
  document.getElementById('streak-display').textContent = `🔥 ${session.streak}`;
}

function streakMsg() {
  if (session.streak === 3) return '🔥 3 streak!';
  if (session.streak === 5) return '⚡ 5 streak!';
  if (session.streak === 10) return '💥 10 in a row!';
  if (session.streak > 2) return `🔥 ${session.streak} streak`;
  return null;
}

// ══════════════════════════════════════════════
// MASTERY + WEAK
// ══════════════════════════════════════════════

function incrementMastery(termId, pts) {
  if (!termId) return;
  state.masteryCounts[termId] = (state.masteryCounts[termId] || 0) + pts;
  // update stage progress
  if (!session.isDrill && session.stageIdx >= 0) {
    const stage = STAGES[session.stageIdx];
    const prog = state.stageProgress[session.stageIdx];
    let mastered = 0;
    stage.questions.forEach(q => {
      if ((state.masteryCounts[q.casual] || 0) >= 3) mastered++;
    });
    prog.mastered = mastered;
  }
}

function addWeak(casual, term) {
  if (!casual) return;
  if (!state.weakTerms.find(w => w.casual === casual)) {
    state.weakTerms.push({casual, term});
  }
}

function removeWeak(casual) {
  if (!casual) return;
  state.weakTerms = state.weakTerms.filter(w => w.casual !== casual);
}

// ══════════════════════════════════════════════
// SUMMARY
// ══════════════════════════════════════════════

function showSummary() {
  showScreen('summary');
  const pct = session.attempted > 0 ? Math.round((session.correct / session.attempted) * 100) : 100;
  const stage = session.isDrill ? {name:'DRILL'} : STAGES[session.stageIdx];

  document.getElementById('sum-stage').textContent = stage.name + ' · COMPLETE';
  document.getElementById('sum-score').innerHTML = `${session.correct}<span> / ${session.attempted}</span>`;
  document.getElementById('sum-label').textContent = 'CORRECT';

  const msg = pct >= 90 ? '🔥 Outstanding. You sound like an analyst.' :
              pct >= 70 ? '✓ Solid. A few more reps on the weak ones.' :
              '↺ Keep going. Repetition builds fluency.';
  document.getElementById('sum-msg').textContent = msg;

  // weak list
  const weakEl = document.getElementById('weak-list');
  const wrong = session.wrongThisSession.filter((w,i,a) => a.findIndex(x=>x.casual===w.casual)===i);
  if (wrong.length > 0) {
    weakEl.innerHTML = `<div class="weak-title">MISSED THIS SESSION</div>` +
      wrong.map(w => `<div class="weak-item"><span class="weak-casual">${w.casual}</span><span class="weak-term">${w.term}</span></div>`).join('');
  } else {
    weakEl.innerHTML = `<div style="color:var(--green);font-size:14px;font-weight:600;margin-bottom:16px">✓ No misses this session!</div>`;
  }

  // next stage btn
  const nextBtn = document.getElementById('sum-next');
  const nextIdx = session.stageIdx + 1;
  if (!session.isDrill && nextIdx < STAGES.length) {
    nextBtn.textContent = `Next: ${STAGES[nextIdx].name} →`;
    nextBtn.onclick = () => startStage(nextIdx);
  } else {
    nextBtn.textContent = '🎯 Drill Weak Words';
    nextBtn.onclick = () => { if (state.weakTerms.length > 0) startDrill(); else goHome(); };
  }
}

function summaryNext() {} // handled dynamically above
function summaryReplay() {
  if (session.isDrill) startDrill();
  else startStage(session.stageIdx);
}

// ══════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.toggle('active', s.id === id);
  });
}

function updateGameHeader() {
  const stage = STAGES[session.stageIdx];
  document.getElementById('game-title').textContent = stage.icon + ' ' + stage.name;
  updateHeartsUI();
  updateStreakUI();
}

function updateProgress() {
  const total = session.queue.length;
  const pos = session.queuePos;
  const pct = total > 0 ? Math.round((pos / total) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${Math.min(pos+1, total)} / ${total}`;
}

function updateActionBar(mode) {
  const bar = document.getElementById('action-bar');
  const skip = document.getElementById('btn-skip');
  const main = document.getElementById('btn-main');
  if (mode === 'hidden') {
    bar.style.display = 'none';
  } else if (mode === 'check') {
    bar.style.display = 'flex';
    skip.style.display = 'block';
    main.textContent = 'Check';
    main.className = 'btn-primary';
    main.onclick = handleMain;
  } else if (mode === 'next') {
    bar.style.display = 'flex';
    skip.style.display = 'none';
    main.textContent = 'Continue →';
    main.className = 'btn-primary green-btn';
    main.onclick = nextQ;
  }
}

function handleMain() {
  const ta = document.getElementById('ta');
  if (ta) { checkOpen(); return; }
}

function nextQ() {
  session.queuePos++;
  if (session.isDrill) renderDrillQ();
  else renderQ();
}

function skipQ() {
  session.queuePos++;
  if (session.isDrill) renderDrillQ();
  else renderQ();
}

function typeTagHTML(icon, label, color) {
  return `<div class="type-tag"><span class="type-dot" style="background:${color}"></span>${label}</div>`;
}

function showFB(id, correct, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'feedback show ' + (correct ? 'fb-correct' : 'fb-wrong');
}

function showToast(msg) {
  if (!msg) return;
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function resetAll() {
  if (!confirm('Reset all progress?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  renderHome();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
renderHome();
</script>
</body>
</html>
